
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Love Anh</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030006;
}

body {
    font-family: 'Baloo 2', cursive;
}

#universe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* CHỮ LUÔN Ở CHÍNH GIỮA MÀN HÌNH */

.text-container {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 20px;
    z-index: 5;
    pointer-events: none;
    text-align: center;
}

.message {
    color: #e77adf;
    font-size: clamp(26px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 0.5px;
    max-width: 100%;

    text-shadow:
        0 0 5px #e45adf,
        0 0 12px #d94bd9,
        0 0 25px #a92aaf,
        0 0 45px #8c168f;

    opacity: 0;
    transform: scale(0.85);

    transition:
        opacity 1.2s ease,
        transform 1.4s cubic-bezier(.2,.8,.2,1);
}

.message.show {
    opacity: 1;
    transform: scale(1);
}

.message.hide {
    opacity: 0;
    transform: scale(1.08);
}

/* TỐI ƯU ĐIỆN THOẠI */

@media (max-width: 600px) {

    .text-container {
        padding: 24px;
    }

    .message {
        font-size: clamp(25px, 8vw, 36px);
        line-height: 1.35;
        letter-spacing: 0;
    }

}

/* ĐIỆN THOẠI NGANG */

@media (max-height: 450px) and (orientation: landscape) {

    .message {
        font-size: clamp(22px, 5vw, 34px);
    }

}
</style>
</head>

<body>

<canvas id="universe"></canvas>

<div class="text-container">
    <div class="message" id="message"></div>
</div>

<script>

// ========================================
// 1. KHỞI TẠO CANVAS
// ========================================

const canvas = document.getElementById("universe");
const ctx = canvas.getContext("2d");

let W, H;
let dpr = 1;

function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


// ========================================
// 2. TẠO CÁC VÌ SAO BAY ĐA CHIỀU
// ========================================

const stars = [];

const STAR_COUNT = 850;

function createStar() {

    // Chọn ngẫu nhiên một trong 4 hướng
    const directions = [
        Math.PI / 2,       // Bay xuống
        0,                 // Bay ngang phải
        Math.PI / 4,       // Bay chéo xuống phải
        Math.PI * 3 / 4    // Bay chéo xuống trái
    ];

    const angle =
        directions[Math.floor(Math.random() * directions.length)]
        + (Math.random() - 0.5) * 0.7;

    const speed = Math.random() * 1.3 + 0.45;

    return {

        x: Math.random() * W,
        y: Math.random() * H,

        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,

        radius: Math.random() * 1.3 + 0.25,

        alpha: Math.random() * 0.7 + 0.3,

        phase: Math.random() * Math.PI * 2,

        twinkle: Math.random() * 0.025 + 0.005

    };
}

function initializeStars() {

    stars.length = 0;

    const count = window.innerWidth < 600 ? 550 : STAR_COUNT;

    for (let i = 0; i < count; i++) {
        stars.push(createStar());
    }

}

initializeStars();

window.addEventListener("resize", initializeStars);


// ========================================
// 4. TẠO TINH VÂN MÀU HỒNG TÍM
// ========================================

const nebulas = [];

for (let i = 0; i < 6; i++) {

    nebulas.push({

        x: Math.random(),
        y: Math.random(),

        radius: Math.random() * 130 + 100,

        phase: Math.random() * 6.28,

        alpha: Math.random() * 0.08 + 0.035

    });

}


// ========================================
// 5. VẼ TINH VÂN
// ========================================

function drawNebula(time) {

    nebulas.forEach(n => {

        const movement = Math.sin(
            time * 0.00025 + n.phase
        );

        const x = n.x * W + movement * 35;

        const y = n.y * H +
            Math.cos(time * 0.0002 + n.phase) * 20;

        const radius = n.radius * (W < 600 ? 0.8 : 1);

        const gradient = ctx.createRadialGradient(
            x, y, 0,
            x, y, radius
        );

        gradient.addColorStop(
            0,
            `rgba(205,45,175,${n.alpha})`
        );

        gradient.addColorStop(
            0.35,
            `rgba(135,30,130,${n.alpha * 0.65})`
        );

        gradient.addColorStop(
            0.7,
            `rgba(80,20,100,${n.alpha * 0.3})`
        );

        gradient.addColorStop(
            1,
            "rgba(20,0,35,0)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

    });

}


// ========================================
// 6. VẼ CÁC HẠT SAO CHUYỂN ĐỘNG
// ========================================

function drawStars(time, delta) {

    stars.forEach(star => {

        // Tăng tốc độ chuyển động
        const speedMultiplier = delta / 16.67;

        star.x += star.vx * speedMultiplier;
        star.y += star.vy * speedMultiplier;

        // Khi hạt đi khỏi màn hình,
        // cho xuất hiện lại ở phía đối diện

        if (star.x > W + 5) star.x = -5;
        if (star.x < -5) star.x = W + 5;

        if (star.y > H + 5) star.y = -5;
        if (star.y < -5) star.y = H + 5;

        // Hiệu ứng nhấp nháy

        const twinkle = Math.sin(
            time * 0.002 + star.phase
        );

        const opacity = Math.max(
            0.1,
            Math.min(
                1,
                star.alpha + twinkle * star.twinkle * 10
            )
        );

        ctx.fillStyle =
            `rgba(255,255,255,${opacity})`;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

}


// ========================================
// 9. CHẠY HOẠT ẢNH VŨ TRỤ
// ========================================

let lastTime = 0;

function animate(time) {

    const delta = lastTime
        ? Math.min(time - lastTime, 40)
        : 16.67;

    lastTime = time;

    ctx.fillStyle = "#030006";

    ctx.fillRect(0, 0, W, H);

    drawNebula(time);

    drawStars(time, delta);


    requestAnimationFrame(animate);

}

requestAnimationFrame(animate);


// ========================================
// 10. HIỆU ỨNG CHỮ XUẤT HIỆN
// ========================================

const messages = [

    "Chúc chàng trai<br>của em",

    "Ngày quốc tế<br>nam giới",

    "Luôn đẹp trai,<br>vui vẻ",

    "Mãi hạnh phúc và<br>luôn yêu em ♥",

    "Kim Ngoc ♥ Anh"

];

const messageElement =
    document.getElementById("message");

let currentMessage = 0;

function showMessage() {

    messageElement.classList.remove("show");
    messageElement.classList.add("hide");

    setTimeout(() => {

        messageElement.innerHTML =
            messages[currentMessage];

        messageElement.classList.remove("hide");

        requestAnimationFrame(() => {

            messageElement.classList.add("show");

        });

        currentMessage++;

        if (currentMessage >= messages.length) {
            currentMessage = 0;
        }

    }, 1200);

}

showMessage();

setInterval(showMessage, 5000);

</script>

</body>
</html>
